name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ahk-validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install AutoHotkey v2.0.26
        shell: pwsh
        run: |
          # Код winget шагу не отдаём: он возвращает ненулевое и при успешной
          # установке (например "already installed"). Судим по факту - есть ли exe.
          winget install -e --id AutoHotkey.AutoHotkey --version 2.0.26 --accept-package-agreements --accept-source-agreements
          Write-Host "winget exit: $LASTEXITCODE"
          $ahk = Join-Path $env:LOCALAPPDATA 'Programs\AutoHotkey\v2\AutoHotkey64.exe'
          if (-not (Test-Path $ahk)) { $ahk = 'C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe' }
          if (-not (Test-Path $ahk)) { throw 'AutoHotkey64.exe not found after install' }
          echo "AHK=$ahk" >> $env:GITHUB_ENV

      - name: Static checks
        shell: pwsh
        run: |
          # Код возврата проверяем после КАЖДОЙ проверки: pwsh отдаёт шагу
          # $LASTEXITCODE только последней нативной команды, и упавшая
          # check-shadowing проходила как успех.
          foreach ($check in 'tools/check-shadowing.mjs', 'tools/check-cyrillic.mjs') {
            node $check
            if ($LASTEXITCODE -ne 0) { throw "$check failed with exit $LASTEXITCODE" }
          }
          # tools/README объявляет сборщик пакета проверкой, но он не запускался.
          # Запускаем и требуем, чтобы он НИЧЕГО не изменил: иначе lang/en.ini в
          # коммите отстал от ключей Loc() в коде.
          # Инвариант: пакет на диске уже соответствует ключам Loc() в коде.
          # Сравниваем хеш до и после прогона, а не git diff - так проверка
          # одинаково работает и в CI, и на грязном рабочем дереве.
          $pack = 'lang/en.ini'
          $before = (Get-FileHash $pack).Hash
          node tools/build-lang-en.mjs
          if ($LASTEXITCODE -ne 0) { throw "build-lang-en.mjs failed with exit $LASTEXITCODE" }
          if ((Get-FileHash $pack).Hash -ne $before) { throw 'lang/en.ini was out of date - the generator rewrote it; commit the result' }

      - name: Validate AHK scripts
        shell: pwsh
        run: |
          $files = @(
            'TextTools.ahk',
            'tests-logic.ahk',
            'tests-editor-open.ahk',
            'tests-usage-and-source.ahk',
            'capture-screenshots.ahk'
          )
          foreach ($f in $files) {
            $log = Join-Path $env:TEMP ("val_" + [IO.Path]::GetFileNameWithoutExtension($f) + ".err.log")
            if (Test-Path $log) { Remove-Item $log -Force }
            $p = Start-Process -FilePath $env:AHK -ArgumentList '/ErrorStdOut','/validate',$f `
              -Wait -PassThru -NoNewWindow -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardError $log
            Write-Host "==== $f ===="
            if (Test-Path $log) { Get-Content $log -ErrorAction SilentlyContinue }
            if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          }

      - name: Stop leftover AutoHotkey
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process -Filter "Name = 'AutoHotkey64.exe'" -ErrorAction SilentlyContinue |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }

      - name: Run test suites
        shell: pwsh
        run: |
          # Все три набора, а не только logic: оконные раньше лишь валидировались,
          # то есть их проверки были вне гейта.
          $suites = @(
            @{ file = 'tests-logic.ahk';            report = 'tt_logic_report.txt' },
            @{ file = 'tests-editor-open.ahk';      report = 'tt_eo_report.txt' },
            @{ file = 'tests-usage-and-source.ahk'; report = 'tt_us_report.txt' }
          )
          $failed = @()
          foreach ($s in $suites) {
            $report = Join-Path $env:TEMP $s.report
            if (Test-Path $report) { Remove-Item $report -Force }
            $p = Start-Process -FilePath $env:AHK -ArgumentList $s.file -PassThru -WorkingDirectory $env:GITHUB_WORKSPACE
            $ok = $p.WaitForExit(180000)
            if (-not $ok) {
              Write-Host "TIMEOUT 180s on $($s.file) - killing PID $($p.Id)"
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              $failed += "$($s.file): timeout"
              continue
            }
            # Код возврата 0 сам по себе ничего не значит: без отчёта он означает
            # "проверок не было", а не "провалов нет". Требуем и файл, и сентинел.
            if (-not (Test-Path $report)) {
              $failed += "$($s.file): no report (exit $($p.ExitCode)) - the suite did not run"
              continue
            }
            Copy-Item $report (Join-Path $env:GITHUB_WORKSPACE $s.report) -Force
            $text = Get-Content $report -Raw
            Write-Host "==== $($s.file) ===="
            Write-Host $text
            if ($p.ExitCode -ne 0) { $failed += "$($s.file): exit $($p.ExitCode)" }
            elseif ($text -notmatch 'ВСЕ ПРОВЕРКИ ПРОШЛИ') { $failed += "$($s.file): report has no success sentinel" }
          }
          if ($failed.Count) { throw ("Test suites failed:`n" + ($failed -join "`n")) }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tt-test-reports
          path: |
            tt_logic_report.txt
            tt_eo_report.txt
            tt_us_report.txt
          if-no-files-found: ignore
