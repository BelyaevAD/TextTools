name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: check
        shell: bash
        run: bash ./gradlew check dokkaGenerate --no-daemon

  package:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
          - os: macos-latest
            task: packageDmg
          - os: ubuntu-latest
            task: packageDeb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: package
        shell: bash
        run: bash ./gradlew ${{ matrix.task }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.task }}
          path: app/build/compose/binaries/**/*
